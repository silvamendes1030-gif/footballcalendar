<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <title>Football Calendar</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #07101f;
      color: #ffffff;
      min-height: 100vh;
    }

    header {
      background: #0d1729;
      padding: 18px;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid #1d2a40;
    }

    .top {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .logo span {
      color: #35d07f;
    }

    .status {
      font-size: 12px;
      color: #8fa1b8;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .hero {
      background: linear-gradient(135deg, #10233f, #0b1729);
      border: 1px solid #203452;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .hero p {
      color: #aebdd0;
      line-height: 1.5;
    }

    .tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      margin-bottom: 20px;
      padding-bottom: 5px;
    }

    .tab {
      border: 1px solid #263957;
      background: #101c30;
      color: #d9e3ef;
      border-radius: 12px;
      padding: 12px 17px;
      white-space: nowrap;
      cursor: pointer;
    }

    .tab.active {
      background: #35d07f;
      color: #06140d;
      border-color: #35d07f;
      font-weight: bold;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    select,
    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #263957;
      background: #101c30;
      color: white;
      outline: none;
    }

    .section-title {
      font-size: 21px;
      margin: 25px 0 12px;
    }

    .matches {
      display: grid;
      gap: 12px;
    }

    .match {
      background: #0e192b;
      border: 1px solid #1d2d47;
      border-radius: 16px;
      padding: 16px;
    }

    .league {
      color: #7f95b1;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .match-main {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
    }

    .team {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .team.away {
      justify-content: flex-end;
      text-align: right;
    }

    .team img {
      width: 38px;
      height: 38px;
      object-fit: contain;
    }

    .team-name {
      font-weight: bold;
    }

    .date {
      text-align: center;
      color: #aebdd0;
      font-size: 13px;
    }

    .score {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .status-badge {
      display: inline-block;
      font-size: 10px;
      padding: 4px 7px;
      border-radius: 7px;
      background: #182842;
      color: #a9bbd1;
    }

    .last-games {
      display: grid;
      gap: 10px;
    }

    .result {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0e192b;
      border: 1px solid #1d2d47;
      border-radius: 14px;
      padding: 14px;
    }

    .result-score {
      font-size: 18px;
      font-weight: bold;
    }

    .competitions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }

    .competition {
      background: #0e192b;
      border: 1px solid #1d2d47;
      border-radius: 15px;
      padding: 15px;
    }

    .competition img {
      width: 45px;
      height: 45px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .empty {
      background: #0e192b;
      border: 1px dashed #2a3d5d;
      border-radius: 15px;
      padding: 25px;
      text-align: center;
      color: #91a3bb;
    }

    footer {
      text-align: center;
      padding: 35px 20px;
      color: #687b94;
      font-size: 12px;
    }

    @media (max-width: 650px) {
      main {
        padding: 14px;
      }

      .hero h1 {
        font-size: 25px;
      }

      .filters {
        grid-template-columns: 1fr;
      }

      .team-name {
        font-size: 13px;
      }

      .team img {
        width: 30px;
        height: 30px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="top">
    <div class="logo">⚽ Football <span>Calendar</span></div>
    <div class="status" id="updateStatus">A carregar...</div>
  </div>
</header>

<main>

  <section class="hero">
    <h1>Calendário de Futebol</h1>
    <p>
      Jogos, resultados, equipas e competições.
      Os dados serão atualizados automaticamente.
    </p>
  </section>

  <div class="tabs">
    <button class="tab active" onclick="mostrarPagina('calendario', this)">
      📅 Calendário
    </button>

    <button class="tab" onclick="mostrarPagina('resultados', this)">
      ✅ Últimos 5 jogos
    </button>

    <button class="tab" onclick="mostrarPagina('competicoes', this)">
      🏆 Competições
    </button>

    <button class="tab" onclick="mostrarPagina('equipas', this)">
      👥 Equipas
    </button>
  </div>

  <section id="calendario">

    <div class="filters">
      <input
        id="pesquisa"
        type="search"
        placeholder="🔎 Procurar equipa..."
        oninput="renderizarJogos()"
      >

      <select id="competicaoFiltro" onchange="renderizarJogos()">
        <option value="">Todas as competições</option>
      </select>
    </div>

    <h2 class="section-title">Próximos jogos</h2>

    <div id="listaJogos" class="matches"></div>

  </section>

  <section id="resultados" style="display:none;">

    <h2 class="section-title">Últimos 5 resultados</h2>

    <div class="filters">
      <input
        id="pesquisaResultado"
        type="search"
        placeholder="🔎 Procurar equipa..."
        oninput="renderizarResultados()"
      >
    </div>

    <div id="listaResultados" class="last-games"></div>

  </section>

  <section id="competicoes" style="display:none;">

    <h2 class="section-title">Competições</h2>

    <div id="listaCompeticoes" class="competitions"></div>

  </section>

  <section id="equipas" style="display:none;">

    <h2 class="section-title">Equipas</h2>

    <div class="filters">
      <input
        id="pesquisaEquipa"
        type="search"
        placeholder="🔎 Procurar equipa..."
        oninput="renderizarEquipas()"
      >
    </div>

    <div id="listaEquipas" class="competitions"></div>

  </section>

</main>

<footer>
  Football Calendar • Dados atualizados automaticamente
</footer>

<script>

let dados = {
  jogos: [],
  resultados: [],
  competicoes: [],
  equipas: [],
  atualizado_em: null
};

async function carregarDados() {

  const status = document.getElementById("updateStatus");

  try {

    const resposta = await fetch("dados.json?cache=" + Date.now());

    if (!resposta.ok) {
      throw new Error("dados.json não encontrado");
    }

    dados = await resposta.json();

    status.textContent =
      "Atualizado: " +
      formatarData(dados.atualizado_em);

    preencherCompeticoes();
    renderizarJogos();
    renderizarResultados();
    renderizarCompeticoes();
    renderizarEquipas();

  } catch (erro) {

    console.error(erro);

    status.textContent = "A aguardar dados";

    document.getElementById("listaJogos").innerHTML = `
      <div class="empty">
        Os dados reais ainda estão a ser preparados.
      </div>
    `;

    document.getElementById("listaResultados").innerHTML = `
      <div class="empty">
        Os resultados reais aparecerão aqui automaticamente.
      </div>
    `;

  }

}

function mostrarPagina(pagina, botao) {

  document.getElementById("calendario").style.display = "none";
  document.getElementById("resultados").style.display = "none";
  document.getElementById("competicoes").style.display = "none";
  document.getElementById("equipas").style.display = "none";

  document.getElementById(pagina).style.display = "block";

  document.querySelectorAll(".tab").forEach(btn => {
    btn.classList.remove("active");
  });

  botao.classList.add("active");

}

function preencherCompeticoes() {

  const select = document.getElementById("competicaoFiltro");

  const nomes = [...new Set(
    dados.jogos
      .map(j => j.competicao?.nome)
      .filter(Boolean)
  )];

  select.innerHTML =
    `<option value="">Todas as competições</option>` +
    nomes
      .sort()
      .map(nome => `<option value="${escapar(nome)}">${escapar(nome)}</option>`)
      .join("");

}

function renderizarJogos() {

  const lista = document.getElementById("listaJogos");

  const pesquisa =
    document.getElementById("pesquisa").value
      .toLowerCase();

  const competicao =
    document.getElementById("competicaoFiltro").value;

  let jogos = dados.jogos.filter(jogo => {

    const casa =
      jogo.casa?.nome?.toLowerCase() || "";

    const fora =
      jogo.fora?.nome?.toLowerCase() || "";

    const nomeCompeticao =
      jogo.competicao?.nome || "";

    return (
      (!pesquisa ||
        casa.includes(pesquisa) ||
        fora.includes(pesquisa)) &&
      (!competicao ||
        nomeCompeticao === competicao)
    );

  });

  jogos = jogos.slice(0, 200);

  if (!jogos.length) {

    lista.innerHTML = `
      <div class="empty">
        Nenhum jogo encontrado.
      </div>
    `;

    return;
  }

  lista.innerHTML = jogos.map(jogo => `

    <article class="match">

      <div class="league">
        🏆 ${escapar(jogo.competicao?.nome || "Competição")}
        ${jogo.competicao?.pais
          ? " • " + escapar(jogo.competicao.pais)
          : ""}
      </div>

      <div class="match-main">

        <div class="team">

          ${
            jogo.casa?.logo
            ? `<img src="${jogo.casa.logo}" alt="">`
            : ""
          }

          <div class="team-name">
            ${escapar(jogo.casa?.nome || "Casa")}
          </div>

        </div>

        <div>

          <div class="date">
            ${formatarData(jogo.data)}
          </div>

          <div class="score">

            ${
              jogo.resultado &&
              jogo.resultado.casa !== null &&
              jogo.resultado.casa !== undefined
              ? `${jogo.resultado.casa} - ${jogo.resultado.fora}`
              : "vs"
            }

          </div>

          <div style="text-align:center;">
            <span class="status-badge">
              ${escapar(jogo.status || "")}
            </span>
          </div>

        </div>

        <div class="team away">

          <div class="team-name">
            ${escapar(jogo.fora?.nome || "Fora")}
          </div>

          ${
            jogo.fora?.logo
            ? `<img src="${jogo.fora.logo}" alt="">`
            : ""
          }

        </div>

      </div>

    </article>

  `).join("");

}

function renderizarResultados() {

  const lista =
    document.getElementById("listaResultados");

  const pesquisa =
    document.getElementById("pesquisaResultado")
      .value.toLowerCase();

  let resultados = dados.resultados.filter(jogo => {

    const casa =
      jogo.casa?.nome?.toLowerCase() || "";

    const fora =
      jogo.fora?.nome?.toLowerCase() || "";

    return (
      !pesquisa ||
      casa.includes(pesquisa) ||
      fora.includes(pesquisa)
    );

  });

  resultados = resultados.slice(0, 200);

  if (!resultados.length) {

    lista.innerHTML = `
      <div class="empty">
        Nenhum resultado encontrado.
      </div>
    `;

    return;
  }

  lista.innerHTML = resultados.map(jogo => `

    <div class="result">

      <div>
        <strong>${escapar(jogo.casa?.nome || "")}</strong>
        <br>
        <span style="color:#71839b;">
          ${formatarData(jogo.data)}
        </span>
      </div>

      <div class="result-score">
        ${jogo.resultado?.casa ?? "-"}
        -
        ${jogo.resultado?.fora ?? "-"}
      </div>

      <div style="text-align:right;">
        <strong>${escapar(jogo.fora?.nome || "")}</strong>
      </div>

    </div>

  `).join("");

}

function renderizarCompeticoes() {

  const lista =
    document.getElementById("listaCompeticoes");

  if (!dados.competicoes.length) {

    lista.innerHTML = `
      <div class="empty">
        As competições reais aparecerão aqui.
      </div>
    `;

    return;
  }

  lista.innerHTML = dados.competicoes.map(c => `

    <div class="competition">

      ${
        c.logo
        ? `<img src="${c.logo}" alt="">`
        : "🏆"
      }

      <h3>${escapar(c.nome || "")}</h3>

      <p style="color:#8092aa;margin-top:6px;">
        ${escapar(c.pais || "")}
      </p>

    </div>

  `).join("");

}

function renderizarEquipas() {

  const lista =
    document.getElementById("listaEquipas");

  const pesquisa =
    document.getElementById("pesquisaEquipa")
      .value.toLowerCase();

  const equipas =
    dados.equipas
      .filter(e =>
        !pesquisa ||
        e.nome?.toLowerCase().includes(pesquisa)
      )
      .slice(0, 300);

  if (!equipas.length) {

    lista.innerHTML = `
      <div class="empty">
        As equipas reais aparecerão aqui.
      </div>
    `;

    return;
  }

  lista.innerHTML = equipas.map(e => `

    <div class="competition">

      ${
        e.logo
        ? `<img src="${e.logo}" alt="">`
        : "⚽"
      }

      <h3>${escapar(e.nome || "")}</h3>

      <p style="color:#8092aa;margin-top:6px;">
        ${escapar(e.pais || "")}
      </p>

    </div>

  `).join("");

}

function formatarData(data) {

  if (!data) return "";

  const d = new Date(data);

  if (Number.isNaN(d.getTime())) {
    return data;
  }

  return d.toLocaleString("pt-PT", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  });

}

function escapar(texto) {

  return String(texto ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

carregarDados();

</script>

</body>
</html>
